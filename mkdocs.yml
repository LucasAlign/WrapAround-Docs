site_name: WrapAround Help
site_description: How to use WrapAround — guides for volunteers, advocates, and program staff.
site_url: https://lucasalign.github.io/WrapAround-Docs/
repo_url: https://github.com/LucasAlign/WrapAround-Docs
repo_name: LucasAlign/WrapAround-Docs
edit_uri: edit/main/docs/
copyright: WrapAround — care coordination

theme:
  name: material
  language: en
  logo: assets/wraparound-icon.png
  favicon: assets/wraparound-icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get Started:
      - For Volunteers: get-started/volunteers.md
      - For Program Staff: get-started/staff.md
      - For Coordinators: get-started/coordinators.md
